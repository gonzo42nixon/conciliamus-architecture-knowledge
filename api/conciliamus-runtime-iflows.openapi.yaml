openapi: 3.1.0
info:
  title: Conciliamus Cloud Integration Runtime API
  version: 1.0.0
  description: >
    Offizielle OpenAPI 3.1.0 Schnittstellenspezifikation für die SAP BTP Cloud Integration Flows 
    der Conciliamus MDM-zu-S/4HANA Geschäftspartner-Synchronisation.
    Umfasst den öffentlichen HTTPS-Inbound-Endpunkt des Batch Receivers sowie den internen 
    ProcessDirect-Endpunkt des Item Processors.
  contact:
    name: Conciliamus Architecture Advisory
    url: https://github.com/gonzo42nixon/Conciliamus

servers:
  - url: https://{tenant-runtime}.it-cpi001.cfapps.eu10.hana.ondemand.com
    description: SAP BTP Cloud Integration Runtime (HTTPS Inbound)
    variables:
      tenant-runtime:
        default: subaccount-trial
        description: Subaccount- bzw. Tenant-Subdomain
  - url: processdirect://{tenant}
    description: Speicherinterne ProcessDirect-Kommunikation (Tenant In-Memory)
    variables:
      tenant:
        default: conciliamus-tenant

paths:
  /http/conciliamus/v1/businesspartners/batch:
    post:
      summary: MDM Geschäftspartner Sammel-Batch einliefern
      operationId: ingestBusinessPartnerBatch
      description: >
        Nimmt einen JSON-Batch mit mehreren Geschäftspartnern aus dem Quellsystem JSD-MDM entgegen.
        Führt eine syntaktische Vorvalidierung durch und zerlegt den Batch via Streaming Iterating Splitter
        in Einzelsätze, die an den Item Processor übergeben werden (ADR-001).
      tags:
        - Ingestion (IFL_MDM_BP_Batch_Receiver)
      security:
        - OAuth2ClientCredentials:
            - ESBMessaging.send
        - BasicAuth: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          description: Optionaler CSRF-Token für HTTPS-Aufrufe (sofern vom Tenant-Frontend forciert)
          schema:
            type: string
            example: Fetch
      requestBody:
        required: true
        description: MDM Geschäftspartner Sammel-Batch
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MDMBusinessPartnerBatch'
            example:
              batchId: "BP-20260714-001"
              createdAt: "2026-07-14T09:00:00Z"
              sourceSystem: "JSD-MDM"
              businessPartners:
                - externalId: "CUST15"
                  company: "Musterfirma Berlin GmbH"
                  street: "Musterstraße"
                  houseNumber: "10"
                  postalCode: "10115"
                  city: "Berlin"
                  country: "DE"
                  email: "kontakt@musterfirma-berlin.de"
                  phone: "+49 30 10000001"
                  vatId: "DE100000001"
      responses:
        '200':
          description: Batch erfolgreich entgegengenommen, validiert und an den internen Splitter übergeben.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestResponse'
              example:
                status: "ACCEPTED"
                batchId: "BP-20260714-001"
                bpTotalCount: 1
                message: "Batch received and disaggregated into item processing stream."
        '400':
          description: Syntaktisch ungültige Payload (z.B. fehlende Pflichtfelder im Kopf oder leeres Array).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "SYNTAX_VALIDATION_ERROR"
                errorMessage: "Missing mandatory property 'batchId' or empty 'businessPartners' array."
                timestamp: "2026-09-04T22:30:00Z"
        '401':
          description: Nicht authentifiziert (ungültiges OAuth 2.0 Bearer Token oder ungültige Credentials).
        '403':
          description: Fehlende Berechtigung (Rolle ESBMessaging.send nicht im Token zugewiesen).
        '500':
          description: Interner Verarbeitungsfehler im Cloud Integration Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conciliamus/v1/businesspartners/item:
    post:
      summary: Atomare Einzelverarbeitung eines Geschäftspartners (ProcessDirect)
      operationId: processBusinessPartnerItem
      description: >
        Interner Endpunkt zur atomaren Verarbeitung eines einzelnen Geschäftspartners (ADR-002).
        Führt fachliche Validierung (ValidateItem.groovy), OData GET Existenzprüfung gegen S/4HANA
        sowie deterministisches Routing zu POST (/A_BusinessPartner) oder PATCH (/A_BusinessPartner('{id}')) aus.
        Fehlgeschlagene technische Aufrufe landen im Data Store BP_FAILED_QUEUE (ADR-004).
      tags:
        - Processing (IFL_MDM_BP_Item_Processor)
      requestBody:
        required: true
        description: Atomarer Datensatz eines einzelnen Geschäftspartners
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartnerItem'
            example:
              externalId: "CUST15"
              company: "Musterfirma Berlin GmbH"
              street: "Musterstraße"
              houseNumber: "10"
              postalCode: "10115"
              city: "Berlin"
              country: "DE"
              email: "kontakt@musterfirma-berlin.de"
              phone: "+49 30 10000001"
              vatId: "DE100000001"
      responses:
        '200':
          description: Geschäftspartner erfolgreich synchronisiert (Neuanlage via POST oder Delta via PATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemProcessResponse'
              example:
                status: "VERIFIED_POST"
                externalId: "CUST15"
                bpNumber: "1000042"
                operation: "POST"
                message: "Business partner successfully created via Deep Insert."
        '422':
          description: Fachlicher Validierungsfehler (z.B. ungültige E-Mail, ungültiger ISO-Ländercode oder Duplikat im ERP). Kein Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemProcessResponse'
              example:
                status: "FAILED_BUSINESS"
                externalId: "CUST15"
                operation: "VALIDATION"
                message: "Validation failed: Invalid email format or duplicate record found (>1 matches)."
        '503':
          description: Technischer Systemausfall (S/4HANA Timeout, Netzwerkunterbrechung). Datensatz in DLQ persistiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemProcessResponse'
              example:
                status: "FAILED_TECHNICAL"
                externalId: "CUST15"
                operation: "ODATA_CALL"
                message: "Target system unreachable. Message persisted to Data Store 'BP_FAILED_QUEUE'."

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: SAP BTP OAuth 2.0 Client Credentials Grant über den XSUAA Service.
      flows:
        clientCredentials:
          tokenUrl: https://{subaccount}.authentication.eu10.hana.ondemand.com/oauth/token
          scopes:
            ESBMessaging.send: Berechtigung zum Senden von Nachrichten an Cloud Integration Inbound Endpoints
    BasicAuth:
      type: http
      scheme: basic
      description: Technische Service-User-Authentifizierung auf SAP BTP.

  schemas:
    MDMBusinessPartnerBatch:
      type: object
      description: JSON-Schema für den Inbound-Batch aus JSD-MDM (basiert auf schemas/mdm-batch.schema.json).
      required:
        - batchId
        - createdAt
        - sourceSystem
        - businessPartners
      properties:
        batchId:
          type: string
          pattern: '^BP-\d{8}-\d{3}$'
          description: Eindeutige Kennung des MDM-Batches nach Muster BP-YYYYMMDD-NNN
          example: "BP-20260714-001"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 Zeitstempel der Batch-Erzeugung im MDM
          example: "2026-07-14T09:00:00Z"
        sourceSystem:
          type: string
          enum: ["JSD-MDM"]
          description: Quellsystem-Identifikator
          example: "JSD-MDM"
        businessPartners:
          type: array
          minItems: 1
          description: Liste der zu synchronisierenden Geschäftspartner
          items:
            $ref: '#/components/schemas/BusinessPartnerItem'

    BusinessPartnerItem:
      type: object
      description: Einzelner Geschäftspartner-Datensatz aus dem MDM-System.
      required:
        - externalId
        - company
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 20
          description: Primärer Identifikator im MDM (wird auf SearchTerm1 in S/4HANA gemappt)
          example: "CUST15"
        company:
          type: string
          minLength: 1
          maxLength: 40
          description: Vollständiger Firmenname (wird auf OrganizationBPName1 gemappt)
          example: "Musterfirma Berlin GmbH"
        street:
          type: string
          maxLength: 60
          description: Straßenname
          example: "Musterstraße"
        houseNumber:
          type: string
          maxLength: 10
          description: Hausnummer
          example: "10"
        postalCode:
          type: string
          maxLength: 10
          description: Postleitzahl
          example: "10115"
        city:
          type: string
          maxLength: 40
          description: Orts- / Städtename
          example: "Berlin"
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 Ländercode
          example: "DE"
        email:
          type: string
          format: email
          description: Valide E-Mail-Adresse für die Kommunikation
          example: "kontakt@musterfirma-berlin.de"
        phone:
          type: string
          maxLength: 30
          description: Telefonnummer
          example: "+49 30 10000001"
        vatId:
          type: string
          maxLength: 20
          description: Umsatzsteuer-Identifikationsnummer (USt-IdNr.)
          example: "DE100000001"

    BatchIngestResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["ACCEPTED"]
        batchId:
          type: string
        bpTotalCount:
          type: integer
        message:
          type: string

    ItemProcessResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["VERIFIED_POST", "VERIFIED_PATCH", "FAILED_BUSINESS", "FAILED_TECHNICAL"]
          description: MPL Custom Status des verarbeiteten Partners
        externalId:
          type: string
        bpNumber:
          type: string
          nullable: true
          description: Interne SAP-Geschäftspartnernummer (sofern ermittelt oder angelegt)
        operation:
          type: string
          enum: ["POST", "PATCH", "VALIDATION", "ODATA_CALL"]
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
        errorMessage:
          type: string
        timestamp:
          type: string
          format: date-time
