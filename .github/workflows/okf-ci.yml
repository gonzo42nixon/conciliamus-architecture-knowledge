name: OKF Quality & API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml fastapi uvicorn pytest httpx

    - name: Validate OKF Bundle (Frontmatter & Links)
      run: |
        python tooling/validate_okf.py

    - name: Build Knowledge Graph & Verify Export
      run: |
        python tooling/build_graph.py

    - name: Run Automated Test Suite
      run: |
        python -m pytest tests -v
